<div class="login-wrapper">
  <div class="login-panel">
    <h1>Inicio de Sesión</h1>
    <p class="subtitle">Inicia sesión con tu cuenta</p>

    <form cForm (ngSubmit)="onSubmit()">
      <div class="field-group">
        <label class="field-label">EMAIL</label>
        <input
          [(ngModel)]="username"
          name="username"
          autoComplete="username"
          cFormControl
          placeholder="Usuario"
          class="dark-input"
        />
      </div>

      <div class="field-group">
        <label class="field-label">CONTRASEÑA</label>
        <input
          [(ngModel)]="password"
          name="password"
          autoComplete="current-password"
          type="password"
          cFormControl
          placeholder="••••••••"
          class="dark-input"
        />
      </div>

      <div #captcha class="captcha-wrap"></div>

      <button cButton class="login-btn" type="submit" [disabled]="!captchaToken() || enviando()">
        {{ enviando() ? 'INGRESANDO...' : 'INICIAR SESIÓN' }}
      </button>

      

    </form>
  </div>

  <div class="image-panel">
    
    <div class="fern-overlay"></div>
  </div>
</div>
