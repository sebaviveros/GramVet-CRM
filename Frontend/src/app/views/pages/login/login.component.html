<div class="login-wrapper">
  <div class="login-panel">
    <h1>Inicio de Sesión</h1>
    <p class="subtitle">Inicia sesión con tu cuenta</p>

    <form cForm (ngSubmit)="onSubmit()">
      <div class="field-group">
        <label class="field-label">USUARIO</label>
        <div class="input-wrap">
          <input
            [(ngModel)]="username"
            name="username"
            autoComplete="username"
            cFormControl
            placeholder="Usuario"
            class="dark-input"
          />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">CONTRASEÑA</label>
        <div class="password-wrap input-wrap">
          <input
            [(ngModel)]="password"
            name="password"
            autoComplete="current-password"
            [type]="verPassword() ? 'text' : 'password'"
            cFormControl
            placeholder="••••••••"
            class="dark-input"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="verPassword.set(!verPassword())"
            [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [title]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (verPassword()) {
              <!-- ojo tachado -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <!-- ojo -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <div #captcha class="captcha-wrap"></div>

      <button cButton class="login-btn" type="submit" [disabled]="!captchaToken() || enviando()">
        {{ enviando() ? 'INGRESANDO...' : 'INICIAR SESIÓN' }}
      </button>

      

    </form>
  </div>

  <div class="image-panel">

    <div class="fern-overlay"></div>

    <!-- Ola de transición imagen → formulario (solo teléfono; oculta en escritorio).
         El relleno coincide con el inicio del degradado de la sección oscura. -->
    <svg class="login-wave" viewBox="0 0 340 40" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,40 L0,18 Q170,-14 340,18 L340,40 Z" fill="#0c2e1a"></path>
    </svg>
  </div>
</div>
