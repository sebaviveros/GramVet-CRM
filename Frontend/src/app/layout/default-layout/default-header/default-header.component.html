<ng-container>
  <c-container [fluid]="true" class="px-3 py-1">
    <button
      [cSidebarToggle]="sidebarId()"
      cHeaderToggler
      class="btn"
      toggle="visible"
      style="margin-inline-start: -14px;"
      aria-label="Toggle sidebar navigation"
    >
      <svg cIcon name="cilMenu" size="lg"></svg>
    </button>

    <c-header-nav class="d-none d-md-flex">
      <c-nav-item>
        <a cNavLink routerLink="/inbox" routerLinkActive="active">Inbox</a>
      </c-nav-item>
    </c-header-nav>

    <!-- Íconos ocultos por pedido del cliente (notificaciones, filtros, mensajería).
         Se dejan comentados por si se reactivan a futuro. -->
    <!--
    <c-header-nav class="d-none d-md-flex ms-auto">
      <a cNavLink>
        <svg cIcon class="my-1" name="cilBell" size="lg"></svg>
      </a>
      <a cNavLink>
        <svg cIcon class="my-1" name="cilList" size="lg"></svg>
      </a>
      <a cNavLink>
        <svg cIcon class="my-1" name="cilEnvelopeOpen" size="lg"></svg>
      </a>
    </c-header-nav>
    -->

    <!-- Selector de tema oculto: la app va siempre en modo oscuro.
         Se deja comentado por si se reactiva el toggle a futuro. -->
    <!--
    <c-header-nav class="ms-auto ms-md-0">
      <div class="nav-item py-1">
        <div class="vr h-100 mx-2 text-body text-opacity-75"></div>
      </div>

      <ng-container *ngTemplateOutlet="themeDropdown" />

      <div class="nav-item py-1">
        <div class="vr h-100 mx-2 text-body text-opacity-75"></div>
      </div>
    </c-header-nav>
    -->

    <c-header-nav class="mx-0 ms-auto align-items-center">
      @if (nombreUsuario()) {
        <span class="user-identity d-none d-sm-inline">
          {{ nombreUsuario() }} <span class="user-identity-sep">/</span> {{ rolUsuario() }}
        </span>
      }
      <ng-container *ngTemplateOutlet="userDropdown" />
    </c-header-nav>

  </c-container>
</ng-container>
<!--</c-header>-->

<ng-template #userDropdown>
  <c-dropdown [popperOptions]="{ placement: 'bottom-start' }" variant="nav-item">
    <button [caret]="false" cDropdownToggle class="py-0 pe-0" aria-label="Open user menu">
      @if (fotoPerfil(); as foto) {
        <c-avatar
          shape="rounded-circle"
          size="md"
          [src]="foto"
          status="success"
          textColor="primary"
          alt="Foto de perfil"
        />
      } @else {
        <!-- Sin foto propia: iniciales, en vez del avatar de ejemplo del template -->
        <c-avatar shape="rounded-circle" size="md" status="success" class="avatar-iniciales">
          {{ iniciales() }}
        </c-avatar>
      }
    </button>
    <ul cDropdownMenu class="pt-0 w-auto">
      <li>
        <h6 cDropdownHeader class="bg-body-secondary text-body-secondary fw-semibold py-2 rounded-top">
          Mi cuenta
        </h6>
      </li>
      <li>
        <hr cDropdownDivider />
      </li>
      <li>
        <a cDropdownItem (click)="fotoInput.click()" style="cursor: pointer;">
          <svg cIcon class="me-2" name="cilImage"></svg>
          Cambiar foto de perfil
        </a>
        <input #fotoInput type="file" accept="image/*" hidden (change)="onFotoSeleccionada($event)" />
      </li>
      <li>
        <a cDropdownItem (click)="onCambiarPassword()" style="cursor: pointer;">
          <svg cIcon class="me-2" name="cilLockLocked"></svg>
          Cambiar contraseña
        </a>
      </li>
      <li>
        <hr cDropdownDivider />
      </li>
      <li>
        <a cDropdownItem (click)="onLogout()" style="cursor: pointer;">
          <svg cIcon class="me-2" name="cilAccountLogout"></svg>
          Cerrar sesión
        </a>
      </li>
    </ul>
  </c-dropdown>
</ng-template>

<ng-template #themeDropdown>
  <c-dropdown alignment="end" variant="nav-item">
    <button [caret]="false" cDropdownToggle aria-label="Open theme picker">
      <svg cIcon [name]="icons()" size="lg"></svg>
    </button>
    <div cDropdownMenu>
      @for (mode of colorModes; track mode.name) {
        <button
          (click)="colorMode.set(mode.name)"
          [active]="colorMode()===mode.name"
          cDropdownItem
          class="d-flex align-items-center"
        >
          <svg cIcon class="me-2" [name]="mode.icon" size="lg"></svg>
          {{ mode.text }}
        </button>
      }
    </div>
  </c-dropdown>
</ng-template>
