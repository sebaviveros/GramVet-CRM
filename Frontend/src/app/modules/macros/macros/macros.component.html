<c-card class="h-100">

  <c-card-header class="component-header">
    <div class="header-left">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <div class="header-text">
        <strong>Respuestas rápidas</strong>
        <span class="header-sub">GramVet CRM</span>
      </div>
    </div>
    <span class="macro-count-badge">{{ macros.length }} respuestas</span>
  </c-card-header>

  <c-card-body>

    <!-- ================= FORM ================= -->

    <p class="section-label">Nueva respuesta</p>

    <div class="macro-form">

      <div class="form-row">

        <div class="macro-input">
          <span class="prefix">/</span>
          <input
            placeholder="macro"
            [(ngModel)]="newMacro.key"
          />
        </div>

        <input
          class="form-control"
          placeholder="Texto de respuesta"
          [(ngModel)]="newMacro.text"
        />

      </div>

      <div class="form-actions">
        <button class="btn btn-cancel" (click)="clearForm()">Cancelar</button>
        <button class="btn btn-primary" (click)="createMacro()">
          + Crear respuesta
        </button>
      </div>

    </div>

    <!-- ================= LISTADO ================= -->

    <div class="macro-list">

      <div class="list-header">
        <p class="section-label">Respuestas existentes</p>
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input
            class="form-control search-input"
            placeholder="Buscar..."
            [(ngModel)]="searchTerm"
          />
        </div>
      </div>

      <div class="table-container">

        <table class="table table-borderless">

          <thead>
            <tr>
              <th>Macro</th>
              <th>Respuesta</th>
              <th class="th-actions">Acciones</th>
            </tr>
          </thead>

          <tbody>

            <tr *ngFor="let macro of filteredMacros">
              <td><span class="macro-tag">/{{ macro.key }}</span></td>
              <td class="td-text">{{ macro.text }}</td>
              <td class="td-actions">
                <button class="icon-btn" title="Editar" (click)="editMacro(macro)">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                  </svg>
                </button>
                <button class="icon-btn icon-btn--danger" title="Eliminar" (click)="deleteMacro(macro.id)">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <path d="M10 11v6M14 11v6"/>
                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                  </svg>
                </button>
              </td>
            </tr>

            <tr *ngIf="filteredMacros.length === 0">
              <td colspan="3" class="empty-state">Sin resultados</td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </c-card-body>

</c-card>
